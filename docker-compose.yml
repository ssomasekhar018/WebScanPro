# ─────────────────────────────────────────────────────────────────────────────
# WebScan Pro — Docker Compose
# Run: docker compose up -d
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── WebScan Pro Dashboard ──────────────────────────────────────────────────
  webscan_pro:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: webscan_pro
    image: webscan_pro:latest
    ports:
      - "8501:8501"
    environment:
      # HuggingFace API token for RAG pipeline (set in .env or shell)
      - HUGGINGFACEHUB_API_TOKEN=${HUGGINGFACEHUB_API_TOKEN:-}
      # Streamlit settings
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
      - STREAMLIT_SERVER_HEADLESS=true
    volumes:
      # Persist scan outputs and logs outside container
      - ./outputs:/app/outputs
      - ./projects/auth_session/logs:/app/projects/auth_session/logs
      - ./projects/auth_session/docs:/app/projects/auth_session/docs
      # Persist HuggingFace model cache across restarts
      - hf_cache:/app/.cache/huggingface
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── DVWA (Damn Vulnerable Web App) — optional test target ─────────────────
  # Uncomment to spin up DVWA for local testing:
  #
  # dvwa:
  #   image: vulnerables/web-dvwa:latest
  #   container_name: dvwa
  #   ports:
  #     - "8080:80"
  #   environment:
  #     - RECAPTCHA_PRIV_KEY=
  #     - RECAPTCHA_PUB_KEY=
  #   restart: unless-stopped

volumes:
  hf_cache:
    driver: local
